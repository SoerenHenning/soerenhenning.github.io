<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{{ .Site.Title }}</title>
<meta name="description" content="{{ .Site.Params.role }} | {{ .Site.Params.organization }}">
<meta name="author" content="{{ .Site.Params.name }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ .Site.Title }}">
<meta property="og:description" content="{{ .Site.Params.role }} | {{ .Site.Params.organization }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Site.BaseURL }}">
{{ with .Site.Params.profileImage -}}
<meta property="og:image" content="{{ . | absURL }}">
{{- end }}

<!-- Google Fonts: Nunito -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Main stylesheet -->
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">

<!-- Favicon (inline SVG fallback) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
