- title: "Theodolite: Scalability Benchmarking of Distributed Stream Processing Engines in Microservice Architectures"
  authors: "**Sören Henning**, Wilhelm Hasselbring"
  venue: "Big Data Research, Volume 25"
  year: 2021
  type: Journal
  doi: "10.1016/j.bdr.2021.100209"
  featured: true
  abstract: >
    We present Theodolite, the first method for benchmarking the scalability of distributed stream processing
    engines used within microservices. The method defines use cases inspired by real Industrial Internet of Things
    analytics scenarios and identifies relevant workload dimensions. We provide a cloud-native benchmarking
    framework, benchmark implementations with Apache Kafka Streams and Apache Flink, and an experimental
    evaluation of different deployment options.
