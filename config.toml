  bio = """
I am a senior researcher at [Dynatrace Research](https://research.dynatrace.com), working at the intersection of software engineering, distributed systems, and data management. My research focuses on scalable and dependable software architectures, particularly for data-intensive applications in modern cloud environments.

What draws me most is how to build and run large-scale systems in practice: stream and event-driven processing, distributed deployments, and the observability needed to keep them understandable and operable. I enjoy connecting these topics to real platforms and tools such as Kubernetes, Kafka, and OpenTelemetry and then closing the loop with empirically grounded performance engineering, meaning careful measurement, benchmarking, and evaluation to understand trade-offs and design systems that hold up in the real world.
"""
